plugins {
    id 'com.android.application'
    // AGP 9 内置 Kotlin 编译；Compose 编译器插件与内置 Kotlin 版本保持一致。
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.rude56.poemstatus'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "io.github.rude56.poemstatus"
        minSdk 33
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        // 发布签名从 keystore.properties 读取（不提交到仓库）。
        // 没有该文件时退回 Android 默认 debug 签名，保证任何人都能直接构建。
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                // 按 UTF-8 读并去掉 BOM：Windows 记事本/PowerShell 默认会写 BOM，
                // 否则第一个键名会变成 "\ufeffstoreFile" 而取不到值。
                def text = propsFile.getText('UTF-8').replace('\uFEFF', '')
                props.load(new StringReader(text))
                storeFile rootProject.file(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // debug 用默认签名即可，方便真机抓堆栈。
        }
        release {
            // 只对 release 开启裁剪/混淆；Hook 侧全靠字符串反射，
            // 需要保住的东西都写在 proguard-rules.pro 里。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // ---- App 设置界面（仅本应用进程）----
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 图标：只用 core 里的那 50 个常用图标，不引入 material-icons-extended
    // （extended 会多出几千个类、APK 增大好几 MB）。
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // ---- SystemUI Hook 侧（compileOnly：运行时由 LSPosed 提供）----
    // 现代 libxposed API：只有现代模块才能声明 staticScope（静态作用域），
    // 这是「模块不允许被作用到范围外的应用」的唯一表达方式。
    // 旧 API（de.robv.android.xposed:api:82）里的 xposedscope 只是「建议列表」，
    // 用户可以随手把模块勾到别的应用上。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ---- 纯 JVM 测试 ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
