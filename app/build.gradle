plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.rude56.poemstatus'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "io.github.rude56.poemstatus"
        minSdk 33
        targetSdk 37
        // versionName 是给人看的发布日期；versionCode 是给系统比大小的序号，每发一版 +1。
        // tag 为 <versionCode>-<versionName>，即 2-2026.11.23。
        versionCode 2
        versionName "2026.11.23"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                def text = propsFile.getText('UTF-8').replace('\uFEFF', '')
                props.load(new StringReader(text))
                storeFile rootProject.file(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = false
        }
    }

    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll(
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
        )
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-blur:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-nav:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'

    implementation 'androidx.navigationevent:navigationevent-compose:1.1.2'
    implementation 'com.materialkolor:material-kolor:5.0.1'

    compileOnly 'io.github.libxposed:api:102.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
