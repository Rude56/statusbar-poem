plugins {
    id 'com.android.application'
    // AGP 9 内置 Kotlin 编译；Compose 编译器插件与内置 Kotlin 版本保持一致。
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.rude56.poemstatus'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "io.github.rude56.poemstatus"
        minSdk 33
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        // 固定 debug keystore：保证后续版本可覆盖安装，签名不随构建机变化。
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 只对 release 开启裁剪/混淆；debug 保持原样，方便真机抓堆栈与热修。
            // Hook 侧全靠字符串反射，R8 删不掉也改不到那些字符串，
            // 需要保住的东西都写在 proguard-rules.pro 里。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // ---- App 设置界面（仅本应用进程）----
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 图标：只用 core 里的那 50 个常用图标，不引入 material-icons-extended
    // （extended 会多出几千个类、APK 增大好几 MB）。
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // ---- SystemUI Hook 侧（compileOnly：运行时由 LSPosed 提供）----
    // 现代 libxposed API：只有现代模块才能声明 staticScope（静态作用域），
    // 这是「模块不允许被作用到范围外的应用」的唯一表达方式。
    // 旧 API（de.robv.android.xposed:api:82）里的 xposedscope 只是「建议列表」，
    // 用户可以随手把模块勾到别的应用上。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // ---- 纯 JVM 测试 ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
